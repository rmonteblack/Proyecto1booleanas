<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simplificador Lógico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <h1 class="text-center mb-4">Evaluador de Expresiones Lógicas</h1>

        <form method="POST" action="/evaluar" class="col-md-6 mx-auto">
            <div class="mb-3">
                <label for="expresion" class="form-label">Ingrese su expresión lógica:</label>
                <input type="text" name="expresion" id="expresion" class="form-control" placeholder="(-p || q) -> r" required>
            </div>
            <div class="text-center">
                <button type="submit" class="btn btn-primary">Evaluar</button>
            </div>
        </form>
    </div>

</body>
</html>
